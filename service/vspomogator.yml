port: /dev/ttyUSB0
layouts:
  - buttons:
    - label: VS Code
      command: 
        com: code
      type: command
    - label: Qt Creator
      command:
        com: qtcreator
    - label: ss
      command:
        com: ss -tulpn | grep
        hitenter: false
      type: keytype
    - label: ls
      command:
        com: ls -la
        hitenter: true
      type: keytype
  - buttons:
    - label: Terminal
      command:
        com: terminator
    - label: List files
      type: command
      command:
        com: terminator
        args:
        - -e
        - ls -la ; read
    - label: Exit
      type: keyseq
      command:
        com: f4
        args:
        - alt
